<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="shortcut icon" href="assets/images/favicon-32x32.png" type="image/x-icon">

</head>

<body>
    <main>
        <section>
            <div class="header">
                <h1>Mortgage Calculator</h1>
                <button>clear all</button>
            </div>
            <form action="">
                <div class="mort">
                    <label for="amount">Mortgage amount</label> <br>
                    <span>$</span>
                    <input type="text" id="amount">
                </div>
                <div class="terms">
                    <div>
                        <label for="term">mortgage term</label><br>
                        <input type="text" id="term">
                    </div>
                    <div>
                        <label for="rates">interest rate</label><br>
                        <input type="text" id="rates">
                    </div>
                </div>
                <div class="type">
                    <div class="payment">
                        <input type="radio" id="payments">
                        <label for="payments">repayments</label><br>

                        <input type="radio" id="interests">
                        <label for="interests">interest only</label>
                    </div>
                    <div class="img">
                        <img src="assets//images/icon-calculator.svg" alt="">
                        <button class="butn">calculate repayments</button>
                    </div>
                </div>
            </form>
        </section>
        <div class="money">
            <img src=" assets/images/illustration-empty.svg" alt="payments icon">
            <div class="texts">
                <h3>Results shown here</h3>
                <p>complete the form and click " calculate repayments" to see what your monthly repayments would be.</p>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
</body>

</html>
